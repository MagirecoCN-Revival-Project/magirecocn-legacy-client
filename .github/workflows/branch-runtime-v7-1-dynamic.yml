name: Runtime i18n v7.1 dynamic runtime product

on:
  push:
    branches: [feature/legacy-client-runtime-i18n]

permissions:
  contents: read

concurrency:
  group: runtime-i18n-v7-1-dynamic
  cancel-in-progress: true

env:
  JP_SOURCE_COMMIT: 58ef03a1395f11072c7f5368e0cb06c37e41cbda

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download current runtime and pinned Japanese data
        run: |
          set -euo pipefail
          ROOT=.build/runtime-v7-1
          JP="$ROOT/jp-source"
          mkdir -p "$ROOT" "$JP"
          python3 -m py_compile \
            tools/apply-cn-js-english-i18n.py \
            tools/apply-cn-js-english-i18n-idempotent.py \
            tools/apply-cn-js-english-i18n-strict.py \
            tools/naturalize-runtime-game-data.py \
            tools/naturalize-runtime-game-data-dynamic.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/verify-cn-js-update-package.py \
            tools/audit-webview-runtime-overlay.py
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -o "$ROOT/input.zip" \
            'https://github.com/HiiragiNemu/magireco-cn-patch/releases/download/latest/cn_js_update.zip'
          sha256sum "$ROOT/input.zip" | tee "$ROOT/INPUT_SHA256.txt"
          for file in cardMagiaMap.json doppelCardMagiaMap.json pieceSkillMap.json emotionSkillMap.json; do
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              -o "$JP/$file" \
              "https://raw.githubusercontent.com/Puella-Care/en-data/${JP_SOURCE_COMMIT}/${file}"
            python3 -m json.tool "$JP/$file" >/dev/null
          done

      - name: Build deterministic natural Chinese runtime twice
        run: |
          set -euo pipefail
          ROOT=.build/runtime-v7-1
          build_one() {
            local n="$1"
            python3 tools/apply-cn-js-english-i18n.py \
              "$ROOT/input.zip" "$ROOT/translated-$n.zip" \
              --report "$ROOT/translation-$n.json"
            python3 tools/naturalize-runtime-game-data-dynamic.py \
              "$ROOT/translated-$n.zip" "$ROOT/natural-$n.zip" \
              --jp-source-dir "$ROOT/jp-source" \
              --minimum-source-translations 50 \
              --report "$ROOT/natural-$n.json"
            python3 tools/stamp-runtime-i18n-marker.py \
              "$ROOT/natural-$n.zip" "$ROOT/final-$n.zip" \
              --package-id runtime-i18n-v7.1-dynamic \
              --report "$ROOT/marker-$n.json"
          }
          build_one 1
          build_one 2
          cmp "$ROOT/final-1.zip" "$ROOT/final-2.zip"
          mv "$ROOT/final-1.zip" \
            "$ROOT/cn_js_update_v7_1_full_cn_natural_runtime.zip"

      - name: Verify runtime package, execution marker and natural Chinese QA
        run: |
          set -euo pipefail
          ROOT=.build/runtime-v7-1
          FINAL="$ROOT/cn_js_update_v7_1_full_cn_natural_runtime.zip"
          python3 tools/verify-cn-js-update-package.py \
            --runtime "$FINAL" --report "$ROOT/package-compatibility.json" \
            > "$ROOT/verification.json"
          python3 tools/audit-webview-runtime-overlay.py \
            --runtime "$FINAL" --report "$ROOT/webview-audit.json"
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          root=Path('.build/runtime-v7-1')
          final=root/'cn_js_update_v7_1_full_cn_natural_runtime.zip'
          natural=json.loads((root/'natural-1.json').read_text('utf-8'))
          compat=json.loads((root/'package-compatibility.json').read_text('utf-8'))
          audit=json.loads((root/'webview-audit.json').read_text('utf-8'))
          with zipfile.ZipFile(final) as zf:
              names=[i.filename for i in zf.infolist() if not i.is_dir()]
              jquery=zf.read('magica/js/libs/jquery-3.7.1.min.js')
          assert len(names)==401
          assert b'__MAGIACN_RUNTIME_I18N__' in jquery
          assert natural['sourceDrivenDescriptionReplacements'] >= 50
          assert natural['highConfidenceArtifactsRemaining'] == {}
          assert natural['temporaryPaddingRemoved'] is True
          assert natural['pathSetAndOrderPreserved'] is True
          assert natural['finalRuntimeDictionaryCount'] == natural['inputRuntimeDictionaryCount']
          assert all(x['valid'] and x['classification']=='runtime-overlay'
                     for x in compat['runtime_packages'])
          assert audit['originalLoaderEnabled'] is True
          assert audit['effectiveBuildStaticallyReady'] is True
          assert audit['runtimePackageValid'] is True
          PY
          sha256sum "$FINAL" | tee "$ROOT/SHA256SUMS.txt"

      - name: Upload v7.1 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cn-js-update-v7-1-dynamic-natural-runtime
          path: |
            .build/runtime-v7-1/cn_js_update_v7_1_full_cn_natural_runtime.zip
            .build/runtime-v7-1/SHA256SUMS.txt
            .build/runtime-v7-1/INPUT_SHA256.txt
            .build/runtime-v7-1/translation-1.json
            .build/runtime-v7-1/natural-1.json
            .build/runtime-v7-1/marker-1.json
            .build/runtime-v7-1/package-compatibility.json
            .build/runtime-v7-1/webview-audit.json
            .build/runtime-v7-1/verification.json
          retention-days: 30
          compression-level: 0
