name: Runtime i18n verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/legacy-client-runtime-i18n
    paths:
      - 'patch/src/main/java/io/kamihama/magianative/**'
      - 'magia-native/**'
      - 'i18n/cn-downloader-ui-text.tsv'
      - 'tools/prepare-cn-downloader-ui-text.py'
      - 'tools/prepare-native-runtime-i18n.py'
      - 'tools/validate-js-update-package.py'
      - 'tools/materialize-ui-text-overlay.py'
      - '.github/workflows/runtime-i18n-verify.yml'

permissions:
  contents: read

concurrency:
  group: runtime-i18n-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          python -m py_compile \
            tools/prepare-cn-downloader-ui-text.py \
            tools/prepare-native-runtime-i18n.py \
            tools/validate-js-update-package.py \
            tools/materialize-ui-text-overlay.py

      - name: Materialise downloader UI Java sources
        run: |
          rm -rf .build/runtime-i18n-java
          python tools/prepare-cn-downloader-ui-text.py \
            --table i18n/cn-downloader-ui-text.tsv \
            --repo-root . \
            --output-root .build/runtime-i18n-java \
            --report .build/runtime-i18n-java-report.json
          test -s .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          grep -q 'MagiaCN 安装器' \
            .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          if grep -R -n -E 'MagiaCN Installer|\(waiting\.\.\.\)|\(initializing\.\.\.\)|\[ERR\]' \
              .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUI.java; then
            echo 'Visible downloader English remained after materialisation.' >&2
            exit 1
          fi

      - name: Generate audited native source
        run: |
          rm -rf .build/runtime-i18n-native
          python tools/prepare-native-runtime-i18n.py \
            --source magia-native/src/MagiaLegacy.cpp \
            --runtime-include magia-native/src/RuntimeI18n.inc \
            --output .build/runtime-i18n-native/MagiaLegacy.cpp \
            --report .build/runtime-i18n-native-report.json
          test -s .build/runtime-i18n-native/MagiaLegacy.cpp
          grep -q '#include <algorithm>' .build/runtime-i18n-native/MagiaLegacy.cpp
          grep -q '#include <unordered_set>' .build/runtime-i18n-native/MagiaLegacy.cpp
          grep -q '#include <utility>' .build/runtime-i18n-native/MagiaLegacy.cpp
          grep -q '#include "RuntimeI18n.inc"' .build/runtime-i18n-native/MagiaLegacy.cpp
          grep -q 'installRuntimeI18nHooks(H);' .build/runtime-i18n-native/MagiaLegacy.cpp
          if grep -n -E 'NdkStrView|fontPathOverwrite|fontPathFix|static std::string hold|font: createWithTTF|font: setTTFConfigInternal' \
              .build/runtime-i18n-native/MagiaLegacy.cpp; then
            echo 'Unsafe legacy font or ABI code survived native generation.' >&2
            exit 1
          fi

      - name: Compile native runtime include on host
        run: |
          cat > .build/runtime-i18n-native-smoke.cpp <<'CPP'
          #include <algorithm>
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <memory>
          #include <mutex>
          #include <string>
          #include <string_view>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <vector>
          #include <sys/stat.h>
          static void log_stub(const char*, ...) {}
          #define LOGI(...) log_stub(__VA_ARGS__)
          #define LOGE(...) log_stub(__VA_ARGS__)
          #include "RuntimeI18n.inc"
          int main() {
              auto H = [](const char*, void*, void**, const char*) {
                  return true;
              };
              installRuntimeI18nHooks(H);
              return sizeof(CNColor4B) == 4 ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I magia-native/src .build/runtime-i18n-native-smoke.cpp

      - name: Check tool command lines
        run: |
          python tools/prepare-native-runtime-i18n.py --help >/dev/null
          python tools/validate-js-update-package.py --help >/dev/null
          python tools/materialize-ui-text-overlay.py --help >/dev/null

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-i18n-verification
          path: |
            .build/runtime-i18n-java-report.json
            .build/runtime-i18n-native-report.json
          if-no-files-found: warn
          retention-days: 14
