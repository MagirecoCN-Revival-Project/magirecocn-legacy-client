name: Runtime i18n verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/prepare-cn-downloader-ui-text.py \
            tools/validate-js-update-package.py \
            tools/materialize-ui-text-overlay.py \
            tools/apply-cn-js-english-i18n.py \
            tools/verify-cn-js-update-package.py

      - name: Materialise downloader UI Java sources
        run: |
          set -euo pipefail
          rm -rf .build/runtime-i18n-java
          python tools/prepare-cn-downloader-ui-text.py \
            --table i18n/cn-downloader-ui-text.tsv \
            --repo-root . \
            --output-root .build/runtime-i18n-java \
            --report .build/runtime-i18n-java-report.json
          test -s .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          grep -q 'MagiaCN 安装器' \
            .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          if grep -R -n -E 'MagiaCN Installer|\(waiting\.\.\.\)|\(initializing\.\.\.\)|\[ERR\]' \
              .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUI.java; then
            echo 'Visible downloader English remained after materialisation.' >&2
            exit 1
          fi

      - name: Preserve verified runtime font-path hook
        run: |
          set -euo pipefail
          # 真机已验证成功的路线必须继续进入最终 native 编译单元：
          # 运行时把引擎读取的 MTF4a5kp 路径改到 TTZhiHeiGB3-W4，
          # 不替换 APK 内字体文件。
          grep -q 'src/MagiaLegacy.cpp' magia-native/CMakeLists.txt
          if grep -q 'prepare-native-runtime-i18n.py' magia-native/CMakeLists.txt; then
            echo '::error::CMake 不得在构建期移除已验证字体路径 hook'
            exit 1
          fi
          grep -q 'static void fontPathFix' magia-native/src/MagiaLegacy.cpp
          grep -q 'fonts/MTF4a5kp.ttf' magia-native/src/MagiaLegacy.cpp
          grep -q 'fonts/TTZhiHeiGB3-W4.ttf' magia-native/src/MagiaLegacy.cpp
          grep -q 'font: createWithTTF(cfg)' magia-native/src/MagiaLegacy.cpp
          grep -q 'font: createWithTTF(str)' magia-native/src/MagiaLegacy.cpp
          grep -q 'font: setTTFConfigInternal' magia-native/src/MagiaLegacy.cpp

      - name: Check tool command lines
        run: |
          set -euo pipefail
          python tools/prepare-cn-downloader-ui-text.py --help >/dev/null
          python tools/validate-js-update-package.py --help >/dev/null
          python tools/materialize-ui-text-overlay.py --help >/dev/null
          python tools/apply-cn-js-english-i18n.py --help >/dev/null
          python tools/verify-cn-js-update-package.py --help >/dev/null

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-i18n-source-verification
          path: .build/runtime-i18n-java-report.json
          if-no-files-found: warn
          retention-days: 14
