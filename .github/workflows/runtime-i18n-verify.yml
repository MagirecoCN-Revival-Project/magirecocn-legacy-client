name: Runtime i18n verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/prepare-cn-downloader-ui-text.py \
            tools/prepare-changed-downloader-ui-text.py \
            tools/prepare-hot-update-transaction.py \
            tools/prepare-safe-external-links.py \
            tools/prepare-webview-overlay-probe.py \
            tools/prepare-native-text-i18n.py \
            tools/audit-webview-runtime-overlay.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/validate-js-update-package.py \
            tools/materialize-ui-text-overlay.py \
            tools/apply-cn-js-english-i18n.py \
            tools/verify-cn-js-update-package.py

      - name: Materialise effective Java sources
        run: |
          set -euo pipefail
          rm -rf .build/runtime-i18n-java
          python tools/prepare-changed-downloader-ui-text.py \
            --table i18n/cn-downloader-ui-text.tsv \
            --repo-root . \
            --output-root .build/runtime-i18n-java \
            --report .build/runtime-i18n-java-report.json
          python tools/prepare-hot-update-transaction.py \
            --java-root .build/runtime-i18n-java \
            --report .build/hot-update-transaction-report.json
          python tools/prepare-safe-external-links.py \
            --java-root .build/runtime-i18n-java \
            --report .build/safe-external-links-report.json
          python tools/prepare-webview-overlay-probe.py \
            --java-root .build/runtime-i18n-java \
            --report .build/webview-overlay-probe-report.json

          test -s .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          grep -q 'MagiaCN 安装器' \
            .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          if grep -R -n -E 'MagiaCN Installer|\(waiting\.\.\.\)|\(initializing\.\.\.\)|\[ERR\]' \
              .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUI.java; then
            echo 'Visible downloader English remained after materialisation.' >&2
            exit 1
          fi

          CHECK=.build/runtime-i18n-java/io/kamihama/magianative/CNHotUpdateCheck.java
          TX=.build/runtime-i18n-java/io/kamihama/magianative/CNHotUpdateTransaction.java
          UI=.build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUI.java
          WV=.build/runtime-i18n-java/jp/f4samurai/web/WebViewImpl.java
          PROBE=.build/runtime-i18n-java/jp/f4samurai/web/RuntimeOverlayProbe.java
          grep -q 'CNHotUpdateTransaction.recover(filesRoot);' "$CHECK"
          grep -q 'CNHotUpdateTransaction.apply(tmp, new File(FILES_DIR));' "$CHECK"
          ! grep -q 'CNDownloaderFix.extractChecked(tmp, new File(FILES_DIR));' "$CHECK"
          grep -q 'childCanonical.equals(rootCanonical)' "$TX"
          ! grep -q 'writeState(txRoot, STATE_ROLLING_BACK);' "$TX"
          test "$(grep -c 'CNSafeExternalLinks.open(act, url);' "$UI")" -eq 2
          ! grep -q 'new Intent(Intent.ACTION_VIEW, Uri.parse(url))' "$UI"
          grep -q '"https".equalsIgnoreCase(uri.getScheme())' \
            .build/runtime-i18n-java/io/kamihama/magianative/CNSafeExternalLinks.java
          grep -q 'RuntimeOverlayProbe.onLocalFile(candidatePath, mime);' "$WV"
          grep -q 'RuntimeOverlayProbe.onPageFinished(view, url);' "$WV"
          grep -q '__MAGIACN_RUNTIME_I18N__' "$PROBE"
          grep -q 'MagiaHook-Status' "$PROBE"

      - name: Generate audited native source
        run: |
          set -euo pipefail
          rm -rf .build/native-generated
          python tools/prepare-native-text-i18n.py \
            --source magia-native/src/MagiaLegacy.cpp \
            --output .build/native-generated/MagiaLegacy.cpp \
            --report .build/native-generated/report.json
          test -s .build/native-generated/MagiaLegacy.cpp
          grep -q '#include "RuntimeTextI18n.inc"' .build/native-generated/MagiaLegacy.cpp
          grep -q '#include "RuntimeFontPathHook.inc"' .build/native-generated/MagiaLegacy.cpp
          grep -q 'installRuntimeTextI18nHooks(H);' .build/native-generated/MagiaLegacy.cpp
          grep -q 'installRuntimeFontPathHooks(H);' .build/native-generated/MagiaLegacy.cpp
          grep -q 'fonts/MTF4a5kp.ttf' magia-native/src/RuntimeFontPathHook.inc
          grep -q 'fonts/TTZhiHeiGB3-W4.ttf' magia-native/src/RuntimeFontPathHook.inc
          grep -q 'SetTtfConfigInternalFn = bool' magia-native/src/RuntimeFontPathHook.inc
          grep -q 'font: createWithTTF(cfg) typed' magia-native/src/RuntimeFontPathHook.inc
          grep -q 'font: createWithTTF(str) typed' magia-native/src/RuntimeFontPathHook.inc
          grep -q 'font: setTTFConfigInternal typed' magia-native/src/RuntimeFontPathHook.inc
          if grep -n -E 'FakeNdkStr|g_engineI18n\.swap|NdkStrView|fontPathOverwrite|fontPathFix|struct CNColor4B \{ unsigned char r, g, b; \}' \
              .build/native-generated/MagiaLegacy.cpp; then
            echo 'Unsafe legacy text/font-hook code survived generation.' >&2
            exit 1
          fi

      - name: Host syntax smoke-test ABI-safe text and font includes
        run: |
          set -euo pipefail
          cat > .build/native-i18n-smoke.cpp <<'CPP'
          #include <algorithm>
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <memory>
          #include <mutex>
          #include <string>
          #include <unordered_map>
          #include <utility>
          #include <vector>
          #include <sys/stat.h>
          static void log_stub(const char*, ...) {}
          #define LOGI(...) log_stub(__VA_ARGS__)
          #define LOGE(...) log_stub(__VA_ARGS__)
          #include "RuntimeTextI18n.inc"
          #include "RuntimeFontPathHook.inc"
          int main() {
              auto H = [](const char*, void*, void**, const char*) { return true; };
              installRuntimeTextI18nHooks(H);
              installRuntimeFontPathHooks(H);
              RuntimeTtfConfig config;
              config.fontFilePath = RUNTIME_FONT_FROM;
              std::string mapped;
              if (!runtimeMapFontPath(config.fontFilePath, mapped, "smoke")) return 2;
              if (mapped != RUNTIME_FONT_TO) return 3;
              return sizeof(CNColor4B) == 4 ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I magia-native/src .build/native-i18n-smoke.cpp

      - name: Audit original loader and effective build
        run: |
          set -euo pipefail
          python tools/audit-webview-runtime-overlay.py \
            --report .build/webview-overlay-audit.json
          python - <<'PY'
          import json
          data = json.load(open('.build/webview-overlay-audit.json', encoding='utf-8'))
          assert data['originalLoaderEnabled'] is True
          assert data['effectiveBuildStaticallyReady'] is True
          PY

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-i18n-source-verification
          path: |
            .build/runtime-i18n-java-report.json
            .build/hot-update-transaction-report.json
            .build/safe-external-links-report.json
            .build/webview-overlay-probe-report.json
            .build/native-generated/report.json
            .build/webview-overlay-audit.json
          if-no-files-found: warn
          retention-days: 14
