name: Runtime i18n verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/prepare-cn-downloader-ui-text.py \
            tools/prepare-changed-downloader-ui-text.py \
            tools/prepare-native-text-i18n.py \
            tools/audit-webview-runtime-overlay.py \
            tools/validate-js-update-package.py \
            tools/materialize-ui-text-overlay.py \
            tools/apply-cn-js-english-i18n.py \
            tools/verify-cn-js-update-package.py

      - name: Materialise changed downloader UI text
        run: |
          set -euo pipefail
          rm -rf .build/runtime-i18n-java
          python tools/prepare-changed-downloader-ui-text.py \
            --table i18n/cn-downloader-ui-text.tsv \
            --repo-root . \
            --output-root .build/runtime-i18n-java \
            --report .build/runtime-i18n-java-report.json
          test -s .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          grep -q 'MagiaCN 安装器' \
            .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUIText.java
          if grep -R -n -E 'MagiaCN Installer|\(waiting\.\.\.\)|\(initializing\.\.\.\)|\[ERR\]' \
              .build/runtime-i18n-java/io/kamihama/magianative/CNCNDownloadUI.java; then
            echo 'Visible downloader English remained after materialisation.' >&2
            exit 1
          fi

      - name: Generate audited native source
        run: |
          set -euo pipefail
          rm -rf .build/native-generated
          python tools/prepare-native-text-i18n.py \
            --source magia-native/src/MagiaLegacy.cpp \
            --output .build/native-generated/MagiaLegacy.cpp \
            --report .build/native-generated/report.json
          test -s .build/native-generated/MagiaLegacy.cpp
          grep -q '#include "RuntimeTextI18n.inc"' .build/native-generated/MagiaLegacy.cpp
          grep -q 'installRuntimeTextI18nHooks(H);' .build/native-generated/MagiaLegacy.cpp
          grep -q 'fonts/MTF4a5kp.ttf' .build/native-generated/MagiaLegacy.cpp
          grep -q 'fonts/TTZhiHeiGB3-W4.ttf' .build/native-generated/MagiaLegacy.cpp
          grep -q 'font: createWithTTF(cfg)' .build/native-generated/MagiaLegacy.cpp
          grep -q 'font: createWithTTF(str)' .build/native-generated/MagiaLegacy.cpp
          grep -q 'font: setTTFConfigInternal' .build/native-generated/MagiaLegacy.cpp
          if grep -n -E 'FakeNdkStr|g_engineI18n\.swap|struct CNColor4B \{ unsigned char r, g, b; \}' \
              .build/native-generated/MagiaLegacy.cpp; then
            echo 'Unsafe legacy text-hook code survived generation.' >&2
            exit 1
          fi

      - name: Host syntax smoke-test ABI-safe text include
        run: |
          set -euo pipefail
          cat > .build/native-text-smoke.cpp <<'CPP'
          #include <algorithm>
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <memory>
          #include <mutex>
          #include <string>
          #include <unordered_map>
          #include <utility>
          #include <vector>
          #include <sys/stat.h>
          static void log_stub(const char*, ...) {}
          #define LOGI(...) log_stub(__VA_ARGS__)
          #define LOGE(...) log_stub(__VA_ARGS__)
          #include "RuntimeTextI18n.inc"
          int main() {
              auto H = [](const char*, void*, void**, const char*) { return true; };
              installRuntimeTextI18nHooks(H);
              return sizeof(CNColor4B) == 4 ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I magia-native/src .build/native-text-smoke.cpp

      - name: Audit WebView overlay chain
        run: |
          set -euo pipefail
          python tools/audit-webview-runtime-overlay.py \
            --report .build/webview-overlay-audit.json
          grep -q 'getCanonicalPath' patch/src/main/java/jp/f4samurai/web/WebViewImpl.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' patch/src/main/java/jp/f4samurai/web/WebViewImpl.java
          grep -q 'SHA-256' patch/src/main/java/io/kamihama/magianative/CNHotUpdateCheck.java
          grep -q '热更新已应用，3 秒后自动重启游戏' \
            patch/src/main/java/io/kamihama/magianative/CNHotUpdateCheck.java

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-i18n-source-verification
          path: |
            .build/runtime-i18n-java-report.json
            .build/native-generated/report.json
            .build/webview-overlay-audit.json
          if-no-files-found: warn
          retention-days: 14
