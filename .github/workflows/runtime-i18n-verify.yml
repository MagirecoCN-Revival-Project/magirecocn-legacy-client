name: Runtime i18n verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'patch/src/main/java/**'
      - 'magia-native/**'
      - 'tools/**'
      - 'i18n/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify-sources:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'feature/legacy-client-runtime-i18n'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and require latest main ancestor
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$MAIN_SHA" HEAD || {
            echo "::error::feature 尚未纳入 latest main $MAIN_SHA"
            exit 1
          }
          echo "PINNED_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/prepare-main-runtime-baseline.py \
            tools/prepare-main-hot-update-hardening.py \
            tools/prepare-cn-downloader-ui-text.py \
            tools/prepare-changed-downloader-ui-text.py \
            tools/prepare-hot-update-transaction.py \
            tools/prepare-safe-external-links.py \
            tools/prepare-webview-overlay-probe.py \
            tools/prepare-native-text-i18n.py \
            tools/audit-webview-runtime-overlay.py \
            tools/naturalize-runtime-game-data.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/validate-js-update-package.py \
            tools/materialize-ui-text-overlay.py \
            tools/apply-cn-js-english-i18n.py \
            tools/apply-cn-js-english-i18n-idempotent.py \
            tools/apply-cn-js-english-i18n-strict.py \
            tools/verify-cn-js-update-package.py

      - name: Materialise latest-main effective Java sources
        run: |
          set -euo pipefail
          BASE=.build/main-baseline
          JAVA="$BASE/patch/src/main/java"
          OUT=.build/runtime-i18n-java
          rm -rf "$BASE" "$OUT"
          mkdir -p "$BASE/patch/src/main"
          cp -a patch/src/main/java "$JAVA"

          python tools/prepare-main-runtime-baseline.py \
            --git-root . --java-root "$JAVA" --main-sha "$PINNED_MAIN_SHA" \
            --require-origin-main --report .build/main-runtime-baseline.json
          python tools/prepare-changed-downloader-ui-text.py \
            --table i18n/cn-downloader-ui-text.tsv --repo-root "$BASE" \
            --output-root "$OUT" --report .build/runtime-i18n-java-report.json
          python tools/prepare-main-hot-update-hardening.py \
            --java-root "$OUT" --report .build/main-hot-update-hardening.json
          python tools/prepare-hot-update-transaction.py \
            --java-root "$OUT" --report .build/hot-update-transaction-report.json
          python tools/prepare-safe-external-links.py \
            --java-root "$OUT" --report .build/safe-external-links-report.json
          python tools/prepare-webview-overlay-probe.py \
            --java-root "$OUT" --report .build/webview-overlay-probe-report.json

          CHECK="$OUT/io/kamihama/magianative/CNHotUpdateCheck.java"
          TX="$OUT/io/kamihama/magianative/CNHotUpdateTransaction.java"
          UI="$OUT/io/kamihama/magianative/CNCNDownloadUI.java"
          WV="$OUT/jp/f4samurai/web/WebViewImpl.java"
          PROBE="$OUT/jp/f4samurai/web/RuntimeOverlayProbe.java"
          CHUNK="$OUT/io/kamihama/magianative/CNChunkedDownload.java"
          MIRRORS="$OUT/io/kamihama/magianative/CNMirrors.java"

          grep -q 'chunks_across_mirrors' "$CHUNK"
          grep -q 'keep-alive' "$CHUNK"
          grep -q 'mirror_race' "$MIRRORS"
          grep -q 'java.util.LinkedHashMap<Integer, java.util.concurrent.Future<Boolean>>' "$CHECK"
          grep -q 'o.optString("sha256", "")' "$CHECK"
          grep -q 'algorithm = "SHA-256"' "$CHECK"
          grep -q '热更新已应用，3 秒后自动重启游戏' "$CHECK"
          grep -q 'CNHotUpdateTransaction.recover(filesRoot);' "$CHECK"
          grep -q 'CNHotUpdateTransaction.apply(tmp, new File(FILES_DIR));' "$CHECK"
          ! grep -q 'CNDownloaderFix.extractChecked(tmp, new File(FILES_DIR));' "$CHECK"
          grep -q 'childCanonical.equals(rootCanonical)' "$TX"
          ! grep -q 'writeState(txRoot, STATE_ROLLING_BACK);' "$TX"
          grep -q 'CNSafeExternalLinks.open(act, url);' "$UI"
          ! grep -q 'new Intent(Intent.ACTION_VIEW, Uri.parse(url))' "$UI"
          grep -q 'RuntimeOverlayProbe.onLocalFile(candidatePath, mime);' "$WV"
          grep -q 'RuntimeOverlayProbe.onPageFinished(view, url);' "$WV"
          grep -q '__MAGIACN_RUNTIME_I18N__' "$PROBE"
          grep -q 'MagiaHook-Status' "$PROBE"

      - name: Generate audited native source
        run: |
          set -euo pipefail
          rm -rf .build/native-generated
          python tools/prepare-native-text-i18n.py \
            --source magia-native/src/MagiaLegacy.cpp \
            --output .build/native-generated/MagiaLegacy.cpp \
            --report .build/native-generated/report.json
          GEN=.build/native-generated/MagiaLegacy.cpp
          REPORT=.build/native-generated/report.json
          grep -q 'BEGIN INLINED RuntimeTextI18n.inc' "$GEN"
          grep -q 'BEGIN INLINED RuntimeFontPathHook.inc' "$GEN"
          grep -q 'installRuntimeTextI18nHooks(H);' "$GEN"
          grep -q 'installRuntimeFontPathHooks(H);' "$GEN"
          grep -q 'SetTtfConfigInternalFn = bool' magia-native/src/RuntimeFontPathHook.inc
          python - <<'PY'
          import json
          data=json.load(open('.build/native-generated/report.json',encoding='utf-8'))
          assert data['implementationsInlined'] is True
          assert data['textDefinitionBeforeCall'] is True
          assert data['fontDefinitionBeforeCall'] is True
          PY
          if grep -n -E 'FakeNdkStr|g_engineI18n\.swap|NdkStrView|fontPathOverwrite|fontPathFix|struct CNColor4B \{ unsigned char r, g, b; \}' "$GEN"; then
            echo 'Unsafe legacy text/font hook survived.' >&2; exit 1
          fi

      - name: Host syntax smoke-test typed text and font hooks
        run: |
          set -euo pipefail
          cat > .build/native-i18n-smoke.cpp <<'CPP'
          #include <algorithm>
          #include <atomic>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <ctime>
          #include <memory>
          #include <mutex>
          #include <string>
          #include <unordered_map>
          #include <utility>
          #include <vector>
          #include <sys/stat.h>
          static void log_stub(const char*, ...) {}
          #define LOGI(...) log_stub(__VA_ARGS__)
          #define LOGE(...) log_stub(__VA_ARGS__)
          #include "RuntimeTextI18n.inc"
          #include "RuntimeFontPathHook.inc"
          int main() {
              auto H=[](const char*,void*,void**,const char*){return true;};
              installRuntimeTextI18nHooks(H); installRuntimeFontPathHooks(H);
              RuntimeTtfConfig c; c.fontFilePath=RUNTIME_FONT_FROM;
              std::string mapped;
              if(!runtimeMapFontPath(c.fontFilePath,mapped,"smoke")) return 2;
              return mapped==RUNTIME_FONT_TO && sizeof(CNColor4B)==4 ? 0 : 1;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I magia-native/src .build/native-i18n-smoke.cpp

      - name: Audit original loader and effective build
        run: |
          set -euo pipefail
          python tools/audit-webview-runtime-overlay.py \
            --report .build/webview-overlay-audit.json
          python - <<'PY'
          import json
          data=json.load(open('.build/webview-overlay-audit.json',encoding='utf-8'))
          assert data['originalLoaderEnabled'] is True
          assert data['effectiveBuildStaticallyReady'] is True
          PY

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-i18n-source-verification
          path: |
            .build/main-runtime-baseline.json
            .build/main-hot-update-hardening.json
            .build/runtime-i18n-java-report.json
            .build/hot-update-transaction-report.json
            .build/safe-external-links-report.json
            .build/webview-overlay-probe-report.json
            .build/native-generated/report.json
            .build/webview-overlay-audit.json
          if-no-files-found: warn
          retention-days: 14
