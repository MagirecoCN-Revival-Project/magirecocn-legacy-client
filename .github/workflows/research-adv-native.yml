name: ADV native evidence

on:
  push:
    branches:
      - research/adv-native-evidence-20260807
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fixed client tree
        uses: actions/checkout@v4

      - name: Install ARM64 binutils
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu

      - name: Export ELF evidence
        run: |
          set -euo pipefail
          SO='lib/arm64-v8a/libmadomagi_native.so'
          test -f "$SO"
          mkdir -p native-evidence

          sha256sum "$SO" | tee native-evidence/libmadomagi_native.sha256
          file "$SO" | tee native-evidence/file.txt
          readelf -hW "$SO" > native-evidence/elf-header.txt
          readelf -SW "$SO" > native-evidence/elf-sections.txt
          readelf -dW "$SO" > native-evidence/elf-dynamic.txt
          readelf -Ws "$SO" > native-evidence/elf-symbols.txt
          readelf -rW "$SO" > native-evidence/elf-relocations.txt
          aarch64-linux-gnu-nm -D -C --defined-only "$SO" > native-evidence/dynamic-symbols-demangled.txt || true
          strings -a -t x "$SO" > native-evidence/strings-offsets.txt

          grep -iE 'Story(Message|Narration|Log|Chara|Effect|Item)|LbUtility|getViewPosition|turnEffect|messageFront|charaFront|charaBack|narration' \
            native-evidence/strings-offsets.txt \
            > native-evidence/adv-strings.txt || true
          grep -iE 'Story(Message|Narration|Log|Chara|Effect|Item)|LbUtility|getViewPosition' \
            native-evidence/dynamic-symbols-demangled.txt \
            > native-evidence/adv-dynamic-symbols.txt || true

          aarch64-linux-gnu-objdump -d -C "$SO" \
            | gzip -9 > native-evidence/libmadomagi_native.objdump.txt.gz

          {
            echo '=== flash slow/fade constants around 0x16937f4 ==='
            aarch64-linux-gnu-objdump -s --start-address=0x16937d0 --stop-address=0x1693820 "$SO"
            echo '=== flash normal-delay constants around 0x167f898 ==='
            aarch64-linux-gnu-objdump -s --start-address=0x167f870 --stop-address=0x167f8c0 "$SO"
            echo '=== thinking scale around 0x17723b4 ==='
            aarch64-linux-gnu-objdump -s --start-address=0x1772390 --stop-address=0x17723e0 "$SO"
            echo '=== thinking fade-in around 0x167ef74 ==='
            aarch64-linux-gnu-objdump -s --start-address=0x167ef50 --stop-address=0x167efa0 "$SO"
            echo '=== StoryEffect stop/fade-out around 0x1680898 ==='
            aarch64-linux-gnu-objdump -s --start-address=0x1680870 --stop-address=0x16808c0 "$SO"
            echo '=== StoryBg shake MoveTo duration around 0x1694b6c ==='
            aarch64-linux-gnu-objdump -s --start-address=0x1694b40 --stop-address=0x1694b90 "$SO"
            echo '=== StoryChara convert sentinel constants ==='
            aarch64-linux-gnu-objdump -s --start-address=0x3d36bd0 --stop-address=0x3d36c10 "$SO" || true
            aarch64-linux-gnu-objdump -s --start-address=0x167a100 --stop-address=0x167a150 "$SO" || true
          } > native-evidence/story-effect-constants.txt

          tar -czf native-evidence.tar.gz native-evidence
          ls -lh native-evidence native-evidence.tar.gz

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: adv-native-evidence
          path: native-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
