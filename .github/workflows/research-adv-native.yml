name: ADV native evidence

on:
  push:
    branches:
      - research/adv-native-evidence-20260807
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fixed client tree
        uses: actions/checkout@v4

      - name: Install ARM64 binutils
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu

      - name: Export ELF evidence
        run: |
          set -euo pipefail
          SO='lib/arm64-v8a/libmadomagi_native.so'
          test -f "$SO"
          mkdir -p native-evidence

          sha256sum "$SO" | tee native-evidence/libmadomagi_native.sha256
          file "$SO" | tee native-evidence/file.txt
          readelf -hW "$SO" > native-evidence/elf-header.txt
          readelf -SW "$SO" > native-evidence/elf-sections.txt
          readelf -dW "$SO" > native-evidence/elf-dynamic.txt
          readelf -Ws "$SO" > native-evidence/elf-symbols.txt
          aarch64-linux-gnu-nm -D -C --defined-only "$SO" > native-evidence/dynamic-symbols-demangled.txt || true
          strings -a -t x "$SO" > native-evidence/strings-offsets.txt

          grep -iE 'Story(Message|Narration|Log|Chara|Effect|Item)|LbUtility|getViewPosition|turnEffect|messageFront|charaFront|charaBack|narration' \
            native-evidence/strings-offsets.txt \
            > native-evidence/adv-strings.txt || true
          grep -iE 'Story(Message|Narration|Log|Chara|Effect|Item)|LbUtility|getViewPosition' \
            native-evidence/dynamic-symbols-demangled.txt \
            > native-evidence/adv-dynamic-symbols.txt || true

          aarch64-linux-gnu-objdump -d -C "$SO" \
            | gzip -9 > native-evidence/libmadomagi_native.objdump.txt.gz

          tar -czf native-evidence.tar.gz native-evidence
          ls -lh native-evidence native-evidence.tar.gz

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: adv-native-evidence
          path: native-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
