name: Runtime i18n Actions probe

on:
  push:
    branches:
      - feature/legacy-client-runtime-i18n

permissions:
  contents: read
  issues: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record branch workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Runtime i18n Actions probe',
              `- run_id: ${context.runId}`,
              `- commit: ${context.sha}`,
              `- ref: ${context.ref}`,
              '- 状态：工作分支 Actions 已开始执行',
              '- main / Release / deployment：未执行',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
