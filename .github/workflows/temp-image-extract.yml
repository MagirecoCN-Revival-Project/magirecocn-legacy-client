name: Temporary image extraction
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Restore extraction script
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/extract_repo_images.py"
          python -m py_compile "$RUNNER_TEMP/extract_repo_images.py"
      - name: Extract all images and UI candidates
        run: python "$RUNNER_TEMP/extract_repo_images.py" "$RUNNER_TEMP/magirecocn-image-extract"
      - name: Upload extracted images
        uses: actions/upload-artifact@v4
        with:
          name: magirecocn-all-images-and-main-ui
          path: ${{ runner.temp }}/magirecocn-image-extract
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
