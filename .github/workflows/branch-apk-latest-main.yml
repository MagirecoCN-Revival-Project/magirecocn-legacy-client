name: Runtime i18n latest-main APK product

on:
  push:
    branches: [feature/legacy-client-runtime-i18n]

permissions:
  contents: read

concurrency:
  group: runtime-i18n-latest-main-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and require latest main ancestor
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$MAIN_SHA" HEAD || {
            echo "::error::feature 尚未纳入 latest main $MAIN_SHA"
            exit 1
          }
          echo "PINNED_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "latest main: $MAIN_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          set -euo pipefail
          mkdir -p .cache/tools .cache/deps
          curl -fL --retry 3 -o .cache/tools/apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar'
          curl -fL --retry 3 -o .cache/tools/baksmali.jar \
            'https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar'

          BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BT_DIR" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
            BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)"
          fi
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(ls -1d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"/* | sort -V | tail -1)"
          fi
          test -d "$NDK_ROOT"

          curl -fL --retry 3 -o .cache/deps/platform.zip \
            'https://dl.google.com/android/repository/platform-33_r02.zip'
          unzip -q -j .cache/deps/platform.zip '*/android.jar' -d .cache/deps
          rm .cache/deps/platform.zip
          curl -fL --retry 3 -o .cache/deps/okhttp-3.12.13.jar \
            'https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar'
          curl -fL --retry 3 -o .cache/deps/okio-1.17.5.jar \
            'https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar'

          echo "BUILD_TOOLS=${BT_DIR%/}" >> "$GITHUB_ENV"
          echo "NDK=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "APKTOOL_JAR=$PWD/.cache/tools/apktool.jar" >> "$GITHUB_ENV"
          echo "BAKSMALI_JAR=$PWD/.cache/tools/baksmali.jar" >> "$GITHUB_ENV"
          echo "DEPS_DIR=$PWD/.cache/deps" >> "$GITHUB_ENV"

      - name: Convert overlay BGM
        run: |
          set -euo pipefail
          mkdir -p .cache/audio/vgms .cache/audio/ff
          curl -fL --retry 3 -o .cache/audio/vgms.tar.gz \
            'https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz'
          tar xzf .cache/audio/vgms.tar.gz -C .cache/audio/vgms
          VGMS="$(find .cache/audio/vgms -name vgmstream-cli -type f | head -1)"
          chmod +x "$VGMS"
          curl -fL --retry 3 -o .cache/audio/ff.tar.xz \
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz'
          tar xJf .cache/audio/ff.tar.xz -C .cache/audio/ff
          FF="$(find .cache/audio/ff -name ffmpeg -type f | head -1)"
          chmod +x "$FF"
          python3 tools/convert-bgm.py --vgmstream "$VGMS" --ffmpeg "$FF"

      - name: Prepare AOSP testkey
        run: |
          set -euo pipefail
          mkdir -p .build/key
          for f in testkey.pk8 testkey.x509.pem; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fL --max-time 60 \
                  -o ".build/key/${f}.b64" \
                  "https://android.googlesource.com/platform/build/+/refs/tags/android-13.0.0_r83/target/product/security/${f}?format=TEXT" \
                  && base64 -d ".build/key/${f}.b64" > ".build/key/${f}" 2>/dev/null \
                  && [ -s ".build/key/${f}" ]; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" = 0 ]; then
              curl -fL --max-time 120 -o ".build/key/${f}" \
                "https://gh-proxy.org/https://raw.githubusercontent.com/aosp-mirror/platform_build/refs/tags/android-13.0.0_r83/target/product/security/${f}"
            fi
          done
          grep -q 'BEGIN CERTIFICATE' .build/key/testkey.x509.pem
          test -s .build/key/testkey.pk8
          echo "SIGN_KEY=$PWD/.build/key/testkey.pk8" >> "$GITHUB_ENV"
          echo "SIGN_CERT=$PWD/.build/key/testkey.x509.pem" >> "$GITHUB_ENV"

      - name: Inject client version and build
        env:
          REQUIRE_ORIGIN_MAIN: '1'
        run: |
          set -euo pipefail
          VER="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/CLIENT_VERSION = \"[^\"]+\"/CLIENT_VERSION = \"${VER}\"/" \
            magia-native/src/MagiaLegacy.cpp
          chmod +x tools/build-local.sh tools/build-apk-core.sh
          tools/build-local.sh "$PWD/.build/latest-main-apk"

      - name: Verify exact signature and write checksums
        run: |
          set -euo pipefail
          APK=.build/latest-main-apk/magireco-legacy.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          FP=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print tolower($NF)}')
          EXPECT='a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc'
          [ "$FP" = "$EXPECT" ] || { echo "::error::signature mismatch $FP"; exit 1; }
          sha256sum "$APK" | tee .build/latest-main-apk/SHA256SUMS.txt
          printf '%s\n' "$PINNED_MAIN_SHA" > .build/latest-main-apk/MAIN_BASELINE.txt

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magirecocn-legacy-runtime-i18n-latest-main
          path: |
            .build/latest-main-apk/magireco-legacy.apk
            .build/latest-main-apk/SHA256SUMS.txt
            .build/latest-main-apk/MAIN_BASELINE.txt
            .build/latest-main-apk/main-runtime-baseline.json
            .build/latest-main-apk/main-hot-update-hardening.json
            .build/latest-main-apk/hot-update-transaction-materialisation.json
            .build/latest-main-apk/safe-external-links-materialisation.json
            .build/latest-main-apk/webview-overlay-probe-materialisation.json
          retention-days: 30
          compression-level: 0
