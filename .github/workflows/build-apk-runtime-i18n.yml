name: 🛡️ 构建 Runtime-I18n APK

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: '只构建和校验，不上传 artifact'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'patch/src/main/java/**'
      - 'magia-native/**'
      - 'tools/**'
      - 'i18n/**'
      - '.github/workflows/build-apk-runtime-i18n.yml'

permissions:
  contents: read

concurrency:
  group: runtime-i18n-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'feature/legacy-client-runtime-i18n'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PINNED_MAIN_SHA: d33561a24233e27b6e592d08bfb398c94c87329f

    steps:
      - name: 🛡️ 仓库与分支护栏
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          [ "${GITHUB_REPOSITORY,,}" = 'magirecocn-revival-project/magirecocn-legacy-client' ] \
            || { echo '::error::仓库不符'; exit 1; }
          [ "$BRANCH" = 'feature/legacy-client-runtime-i18n' ] \
            || { echo "::error::仅允许工作分支，当前 $BRANCH"; exit 1; }

      - name: 📦 检出工作分支并锁定最新 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📌 拉取只读 main 基线
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CURRENT=$(git rev-parse refs/remotes/origin/main)
          [ "$CURRENT" = "$PINNED_MAIN_SHA" ] || {
            echo "::error::main 已前进：期望 $PINNED_MAIN_SHA，当前 $CURRENT；先审查再构建"
            exit 1
          }

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 准备 Android 构建工具
        run: |
          set -euo pipefail
          mkdir -p .cache/tools .cache/deps
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/tools/apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar'
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/tools/baksmali.jar \
            'https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar'

          BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$BT_DIR" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
            BT_DIR="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)"
          fi
          echo "BUILD_TOOLS=${BT_DIR%/}" >> "$GITHUB_ENV"

          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_BASE="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"
            NDK_ROOT="$(ls -1d "$NDK_BASE"/* 2>/dev/null | sort -V | tail -1)"
          fi
          test -d "$NDK_ROOT"
          echo "NDK=$NDK_ROOT" >> "$GITHUB_ENV"

          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/deps/platform.zip \
            'https://dl.google.com/android/repository/platform-33_r02.zip'
          unzip -q -j .cache/deps/platform.zip '*/android.jar' -d .cache/deps
          rm .cache/deps/platform.zip
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/deps/okhttp-3.12.13.jar \
            'https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.12.13/okhttp-3.12.13.jar'
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/deps/okio-1.17.5.jar \
            'https://repo1.maven.org/maven2/com/squareup/okio/okio/3.12.13/okio-1.17.5.jar' || \
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/deps/okio-1.17.5.jar \
            'https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar'

          echo "APKTOOL_JAR=$PWD/.cache/tools/apktool.jar" >> "$GITHUB_ENV"
          echo "BAKSMALI_JAR=$PWD/.cache/tools/baksmali.jar" >> "$GITHUB_ENV"
          echo "DEPS_DIR=$PWD/.cache/deps" >> "$GITHUB_ENV"

      - name: 🎵 转换浮层 BGM
        run: |
          set -euo pipefail
          mkdir -p .cache/audio/vgms .cache/audio/ff
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/audio/vgms.tar.gz \
            'https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz'
          tar xzf .cache/audio/vgms.tar.gz -C .cache/audio/vgms
          VGMS="$(find .cache/audio/vgms -name vgmstream-cli -type f | head -1)"
          chmod +x "$VGMS"
          curl --fail --location --silent --show-error --retry 3 \
            -o .cache/audio/ff.tar.xz \
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz'
          tar xJf .cache/audio/ff.tar.xz -C .cache/audio/ff
          FF="$(find .cache/audio/ff -name ffmpeg -type f | head -1)"
          chmod +x "$FF"
          python3 tools/convert-bgm.py --vgmstream "$VGMS" --ffmpeg "$FF"

      - name: 🔏 准备 AOSP testkey
        run: |
          set -euo pipefail
          mkdir -p .build/key
          for f in testkey.pk8 testkey.x509.pem; do
            ok=0
            for attempt in 1 2 3; do
              if curl --fail --location --silent --show-error --max-time 60 \
                  -o ".build/key/${f}.b64" \
                  "https://android.googlesource.com/platform/build/+/refs/tags/android-13.0.0_r83/target/product/security/${f}?format=TEXT" \
                  && base64 -d ".build/key/${f}.b64" > ".build/key/${f}" 2>/dev/null \
                  && [ -s ".build/key/${f}" ]; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" = 0 ]; then
              curl --fail --location --silent --show-error --max-time 120 \
                -o ".build/key/${f}" \
                "https://gh-proxy.org/https://raw.githubusercontent.com/aosp-mirror/platform_build/refs/tags/android-13.0.0_r83/target/product/security/${f}"
            fi
          done
          grep -q 'BEGIN CERTIFICATE' .build/key/testkey.x509.pem
          test -s .build/key/testkey.pk8
          echo "SIGN_KEY=$PWD/.build/key/testkey.pk8" >> "$GITHUB_ENV"
          echo "SIGN_CERT=$PWD/.build/key/testkey.x509.pem" >> "$GITHUB_ENV"

      - name: 🔢 注入客户端构建号
        run: |
          set -euo pipefail
          VER="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/CLIENT_VERSION = \"[^\"]+\"/CLIENT_VERSION = \"${VER}\"/" \
            magia-native/src/MagiaLegacy.cpp
          grep -q "CLIENT_VERSION = \"${VER}\"" magia-native/src/MagiaLegacy.cpp
          echo "CLIENT_VERSION=$VER" >> "$GITHUB_ENV"

      - name: 🧪 源码预检
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/prepare-main-runtime-baseline.py \
            tools/prepare-main-hot-update-hardening.py \
            tools/prepare-hot-update-transaction.py \
            tools/prepare-safe-external-links.py \
            tools/prepare-webview-overlay-probe.py \
            tools/prepare-native-text-i18n.py \
            tools/audit-webview-runtime-overlay.py \
            tools/check-apk-freshness.py
          python3 tools/check-entry-guard.py
          grep -q 'getCanonicalPath' patch/src/main/java/jp/f4samurai/web/WebViewImpl.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' patch/src/main/java/jp/f4samurai/web/WebViewImpl.java

      - name: 🏗️ Java/C++ 全链构建、签名与自检
        env:
          REQUIRE_ORIGIN_MAIN: '1'
        run: |
          set -euo pipefail
          chmod +x tools/build-local.sh tools/build-apk-core.sh
          tools/build-local.sh "$PWD/.build/runtime-i18n-apk"

      - name: 🔍 最终签名指纹
        run: |
          set -euo pipefail
          APK=.build/runtime-i18n-apk/magireco-legacy.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          FP=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print tolower($NF)}')
          EXPECT='a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc'
          [ "$FP" = "$EXPECT" ] || { echo "::error::签名指纹不符：$FP"; exit 1; }
          sha256sum "$APK" | tee .build/runtime-i18n-apk/SHA256SUMS.txt

      - name: 📤 上传 APK artifact
        if: ${{ github.event_name == 'pull_request' || inputs.verify_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: magirecocn-legacy-client-runtime-i18n
          path: |
            .build/runtime-i18n-apk/magireco-legacy.apk
            .build/runtime-i18n-apk/SHA256SUMS.txt
            .build/runtime-i18n-apk/main-runtime-baseline.json
            .build/runtime-i18n-apk/main-hot-update-hardening.json
            .build/runtime-i18n-apk/hot-update-transaction-materialisation.json
            .build/runtime-i18n-apk/safe-external-links-materialisation.json
            .build/runtime-i18n-apk/webview-overlay-probe-materialisation.json
          retention-days: 30
          compression-level: 0

      - name: 📊 构建报告
        if: always()
        run: |
          APK=.build/runtime-i18n-apk/magireco-legacy.apk
          {
            echo '## Runtime-I18n APK'
            echo "- 工作分支：\`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`"
            echo "- main 基线：\`$PINNED_MAIN_SHA\`"
            echo "- 客户端版本：\`${CLIENT_VERSION:-未生成}\`"
            if [ -f "$APK" ]; then
              echo '- 状态：✅ latest-main、双 ABI、三组 dex、签名与产物自检通过'
              echo "- SHA-256：\`$(sha256sum "$APK" | awk '{print $1}')\`"
              echo '- 发布动作：未执行；仅上传人工测试 artifact'
            else
              echo '- 状态：❌ 未产出 APK'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
