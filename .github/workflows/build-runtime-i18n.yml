name: 构建 v3 国服权威中文覆盖包

on:
  workflow_dispatch:
    inputs:
      authoritative_runtime_url:
        description: '已经按国服 APK 回填的 v3 系列运行时包 HTTPS 地址'
        type: string
        required: true
      authoritative_runtime_sha256:
        description: '上述权威包的 SHA-256，必须填写'
        type: string
        required: true
      package_id:
        description: '写入 window.__MAGIACN_RUNTIME_I18N__ 的包标识'
        type: string
        required: true
        default: 'v3-authoritative-cn'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_URL: ${{ inputs.authoritative_runtime_url }}
      INPUT_SHA256: ${{ inputs.authoritative_runtime_sha256 }}
      PACKAGE_ID: ${{ inputs.package_id }}

    steps:
      - name: 校验仓库、分支与输入
        run: |
          set -euo pipefail
          [ "${GITHUB_REPOSITORY,,}" = 'magirecocn-revival-project/magirecocn-legacy-client' ] \
            || { echo '::error::仓库不符'; exit 1; }
          [ "$GITHUB_REF_NAME" = 'feature/legacy-client-runtime-i18n' ] \
            || { echo '::error::只允许工作分支运行'; exit 1; }
          case "$INPUT_URL" in https://*) ;; *) echo '::error::输入必须为 HTTPS'; exit 1;; esac
          printf '%s' "$INPUT_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$' \
            || { echo '::error::必须提供 64 位 SHA-256'; exit 1; }
          printf '%s' "$PACKAGE_ID" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
            || { echo '::error::package_id 格式错误'; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载并确认权威输入
        run: |
          set -euo pipefail
          ROOT=.build/v3-authoritative
          mkdir -p "$ROOT"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -o "$ROOT/input.zip" "$INPUT_URL"
          ACTUAL=$(sha256sum "$ROOT/input.zip" | awk '{print $1}')
          [ "${ACTUAL,,}" = "${INPUT_SHA256,,}" ] || {
            echo "::error::输入哈希不符：$ACTUAL"; exit 1;
          }
          python3 -m py_compile \
            tools/apply-authoritative-cn-web-font.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/verify-cn-js-update-package.py \
            tools/audit-webview-runtime-overlay.py

      - name: 应用国服 WebView 字体机制并确定性复构建
        run: |
          set -euo pipefail
          ROOT=.build/v3-authoritative
          build_once() {
            local suffix="$1"
            python3 tools/apply-authoritative-cn-web-font.py \
              "$ROOT/input.zip" "$ROOT/font-$suffix.zip" \
              --report "$ROOT/font-$suffix.json"
            python3 tools/stamp-runtime-i18n-marker.py \
              "$ROOT/font-$suffix.zip" "$ROOT/final-$suffix.zip" \
              --package-id "$PACKAGE_ID" \
              --report "$ROOT/marker-$suffix.json"
          }
          build_once one
          build_once two
          cmp "$ROOT/final-one.zip" "$ROOT/final-two.zip"
          mv "$ROOT/final-one.zip" "$ROOT/cn_js_update_v3_authoritative_cn.zip"

      - name: 验证运行时覆盖包
        run: |
          set -euo pipefail
          ROOT=.build/v3-authoritative
          FINAL="$ROOT/cn_js_update_v3_authoritative_cn.zip"
          python3 tools/verify-cn-js-update-package.py \
            --runtime "$FINAL" --report "$ROOT/package-compatibility.json" \
            > "$ROOT/verification-output.json"
          python3 tools/audit-webview-runtime-overlay.py \
            --runtime "$FINAL" --report "$ROOT/webview-runtime-overlay-audit.json"
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root=Path('.build/v3-authoritative')
          final=root/'cn_js_update_v3_authoritative_cn.zip'
          font=json.loads((root/'font-one.json').read_text('utf-8'))
          with zipfile.ZipFile(final) as zf:
              files=[i.filename for i in zf.infolist() if not i.is_dir()]
              base=zf.read('magica/js/_common/base.js')
          assert len(files)==401
          start=base.index(b"font-family: 'mbm'")
          segment=base[start:start+180]
          assert b'String(a.motoya)' in segment
          assert b'String(a.mbm)' not in segment
          assert font['mbmFamilyPayload']=='motoya'
          report={
              'schema':1,
              'inputSha256':font['inputSha256'],
              'outputSha256':hashlib.sha256(final.read_bytes()).hexdigest(),
              'entries':len(files),
              'baselinePolicy':'v3-authoritative-only',
              'officialCnWebViewFontMechanism':True,
              'deterministicRebuild':True,
              'traditionalMachineTranslationUsed':False,
          }
          (root/'v3-authoritative-QA.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY

      - name: 上传权威覆盖包与 QA
        uses: actions/upload-artifact@v4
        with:
          name: cn-js-update-v3-authoritative-cn
          path: |
            .build/v3-authoritative/cn_js_update_v3_authoritative_cn.zip
            .build/v3-authoritative/v3-authoritative-QA.json
            .build/v3-authoritative/font-one.json
            .build/v3-authoritative/marker-one.json
            .build/v3-authoritative/package-compatibility.json
            .build/v3-authoritative/webview-runtime-overlay-audit.json
            .build/v3-authoritative/verification-output.json
          retention-days: 30
          compression-level: 0
