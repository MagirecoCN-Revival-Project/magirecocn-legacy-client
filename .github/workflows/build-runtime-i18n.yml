name: 🈶 构建前端汉化覆盖包

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: '基础运行时 cn_js_update.zip 的 HTTPS 地址'
        type: string
        required: true
        default: 'https://github.com/HiiragiNemu/magireco-cn-patch/releases/download/latest/cn_js_update.zip'
      runtime_sha256:
        description: '基础包 SHA-256；留空则只记录、不强制匹配'
        type: string
        required: false
        default: ''
      source_url:
        description: '可选：vNext 去重 JSON 源 ZIP 的 HTTPS 地址'
        type: string
        required: false
        default: ''
      source_sha256:
        description: '可选：vNext 源 ZIP SHA-256'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_URL: ${{ inputs.runtime_url }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}

    steps:
      - name: 🛡️ 校验仓库与输入
        run: |
          set -euo pipefail
          ALLOWED='magirecocn-revival-project/magirecocn-legacy-client'
          if [ "${GITHUB_REPOSITORY,,}" != "$ALLOWED" ]; then
            echo "::error::本工作流仅允许在 $ALLOWED 内运行"
            exit 1
          fi
          case "$RUNTIME_URL" in
            https://*) ;;
            *) echo '::error::runtime_url 必须是 HTTPS 地址'; exit 1 ;;
          esac
          if [ -n "$SOURCE_URL" ]; then
            case "$SOURCE_URL" in
              https://*) ;;
              *) echo '::error::source_url 必须是 HTTPS 地址'; exit 1 ;;
            esac
          fi
          for value in "$RUNTIME_SHA256" "$SOURCE_SHA256"; do
            if [ -n "$value" ] && ! printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo '::error::SHA-256 必须是 64 位十六进制或留空'
              exit 1
            fi
          done

      - name: 📦 检出指定分支
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 校验工具与下载源包
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply-cn-js-english-i18n.py \
            tools/verify-cn-js-update-package.py

          mkdir -p .build/runtime-i18n
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o .build/runtime-i18n/input-runtime.zip "$RUNTIME_URL"

          ACTUAL_RUNTIME=$(sha256sum .build/runtime-i18n/input-runtime.zip | awk '{print $1}')
          echo "基础运行时包 SHA-256: $ACTUAL_RUNTIME"
          if [ -n "$RUNTIME_SHA256" ] && [ "${ACTUAL_RUNTIME,,}" != "${RUNTIME_SHA256,,}" ]; then
            echo "::error::基础运行时包哈希不符：期望 $RUNTIME_SHA256，实得 $ACTUAL_RUNTIME"
            exit 1
          fi

          if [ -n "$SOURCE_URL" ]; then
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -o .build/runtime-i18n/input-source.zip "$SOURCE_URL"
            ACTUAL_SOURCE=$(sha256sum .build/runtime-i18n/input-source.zip | awk '{print $1}')
            echo "vNext 源包 SHA-256: $ACTUAL_SOURCE"
            if [ -n "$SOURCE_SHA256" ] && [ "${ACTUAL_SOURCE,,}" != "${SOURCE_SHA256,,}" ]; then
              echo "::error::vNext 源包哈希不符：期望 $SOURCE_SHA256，实得 $ACTUAL_SOURCE"
              exit 1
            fi
          fi

      - name: 🈶 生成运行时汉化包
        run: |
          set -euo pipefail
          python3 tools/apply-cn-js-english-i18n.py \
            .build/runtime-i18n/input-runtime.zip \
            .build/runtime-i18n/cn_js_update_runtime_i18n.zip \
            --report .build/runtime-i18n/cn_js_update_runtime_i18n_QA.json

          # 第二次独立生成必须逐字节一致，防止时间戳或遍历顺序污染产物。
          python3 tools/apply-cn-js-english-i18n.py \
            .build/runtime-i18n/input-runtime.zip \
            .build/runtime-i18n/reproducibility-check.zip \
            --report .build/runtime-i18n/reproducibility-check_QA.json
          cmp .build/runtime-i18n/cn_js_update_runtime_i18n.zip \
              .build/runtime-i18n/reproducibility-check.zip
          rm -f .build/runtime-i18n/reproducibility-check.zip \
                .build/runtime-i18n/reproducibility-check_QA.json
          echo '确定性构建校验通过'

      - name: ✅ 验收运行时包与 vNext 源
        run: |
          set -euo pipefail
          ARGS=(
            --runtime .build/runtime-i18n/input-runtime.zip
            --runtime .build/runtime-i18n/cn_js_update_runtime_i18n.zip
            --report .build/runtime-i18n/cn_js_update_package_compatibility_QA.json
          )
          if [ -f .build/runtime-i18n/input-source.zip ]; then
            ARGS+=(--source .build/runtime-i18n/input-source.zip)
          fi
          python3 tools/verify-cn-js-update-package.py "${ARGS[@]}" \
            > .build/runtime-i18n/verification-output.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.build/runtime-i18n/cn_js_update_package_compatibility_QA.json')
          data = json.loads(p.read_text('utf-8'))
          assert all(x['valid'] and x['classification'] == 'runtime-overlay'
                     for x in data['runtime_packages'])
          if data['source_package'] is not None:
              assert data['source_package']['valid']
              assert data['source_package']['classification'] == 'deduplicated-source-only'
          assert data['decision']['html_replacement_mechanism_active'] is True
          PY

      - name: 📤 上传覆盖包与 QA
        uses: actions/upload-artifact@v4
        with:
          name: cn-js-update-runtime-i18n
          path: |
            .build/runtime-i18n/cn_js_update_runtime_i18n.zip
            .build/runtime-i18n/cn_js_update_runtime_i18n_QA.json
            .build/runtime-i18n/cn_js_update_package_compatibility_QA.json
            .build/runtime-i18n/verification-output.json
          retention-days: 30
          compression-level: 0

      - name: 📊 构建报告
        if: always()
        run: |
          {
            echo '## 前端汉化覆盖包'
            echo
            if [ -f .build/runtime-i18n/cn_js_update_runtime_i18n.zip ]; then
              echo '- 状态：✅ 构建并验收通过'
              echo "- SHA-256：\`$(sha256sum .build/runtime-i18n/cn_js_update_runtime_i18n.zip | awk '{print $1}')\`"
              echo '- 部署类型：完整 `magica/js/**` + `magica/template/**` 运行时覆盖包'
              echo '- 发布动作：未执行；本工作流只上传临时 artifact'
            else
              echo '- 状态：❌ 未产出覆盖包'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
