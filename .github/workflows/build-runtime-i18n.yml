name: 🈶 构建前端汉化覆盖包 v7

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: '基础运行时 cn_js_update.zip 的 HTTPS 地址'
        type: string
        required: true
        default: 'https://github.com/HiiragiNemu/magireco-cn-patch/releases/download/latest/cn_js_update.zip'
      runtime_sha256:
        description: '基础包 SHA-256；留空则只记录、不强制匹配'
        type: string
        required: false
        default: ''
      source_url:
        description: '可选：vNext 去重 JSON 源 ZIP 的 HTTPS 地址'
        type: string
        required: false
        default: ''
      source_sha256:
        description: '可选：vNext 源 ZIP SHA-256'
        type: string
        required: false
        default: ''
      package_id:
        description: '写入 window.__MAGIACN_RUNTIME_I18N__ 的包标识'
        type: string
        required: true
        default: 'runtime-i18n-v7'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNTIME_URL: ${{ inputs.runtime_url }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PACKAGE_ID: ${{ inputs.package_id }}

    steps:
      - name: 🛡️ 校验仓库、分支与输入
        run: |
          set -euo pipefail
          ALLOWED='magirecocn-revival-project/magirecocn-legacy-client'
          if [ "${GITHUB_REPOSITORY,,}" != "$ALLOWED" ]; then
            echo "::error::本工作流仅允许在 $ALLOWED 内运行"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != 'feature/legacy-client-runtime-i18n' ]; then
            echo "::error::只允许从 feature/legacy-client-runtime-i18n 手动运行"
            exit 1
          fi
          case "$RUNTIME_URL" in https://*) ;; *) echo '::error::runtime_url 必须为 HTTPS'; exit 1;; esac
          if [ -n "$SOURCE_URL" ]; then
            case "$SOURCE_URL" in https://*) ;; *) echo '::error::source_url 必须为 HTTPS'; exit 1;; esac
          fi
          for value in "$RUNTIME_SHA256" "$SOURCE_SHA256"; do
            if [ -n "$value" ] && ! printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo '::error::SHA-256 必须是 64 位十六进制或留空'
              exit 1
            fi
          done
          if ! printf '%s' "$PACKAGE_ID" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo '::error::package_id 只允许 1–64 位字母、数字、点、下划线和连字符'
            exit 1
          fi

      - name: 📦 检出工作分支
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 校验工具并下载源包
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply-cn-js-english-i18n.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/verify-cn-js-update-package.py

          mkdir -p .build/runtime-i18n
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            -o .build/runtime-i18n/input-runtime.zip "$RUNTIME_URL"

          ACTUAL_RUNTIME=$(sha256sum .build/runtime-i18n/input-runtime.zip | awk '{print $1}')
          echo "基础运行时包 SHA-256: $ACTUAL_RUNTIME"
          if [ -n "$RUNTIME_SHA256" ] && [ "${ACTUAL_RUNTIME,,}" != "${RUNTIME_SHA256,,}" ]; then
            echo "::error::基础运行时包哈希不符：期望 $RUNTIME_SHA256，实得 $ACTUAL_RUNTIME"
            exit 1
          fi

          if [ -n "$SOURCE_URL" ]; then
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -o .build/runtime-i18n/input-source.zip "$SOURCE_URL"
            ACTUAL_SOURCE=$(sha256sum .build/runtime-i18n/input-source.zip | awk '{print $1}')
            echo "vNext 源包 SHA-256: $ACTUAL_SOURCE"
            if [ -n "$SOURCE_SHA256" ] && [ "${ACTUAL_SOURCE,,}" != "${SOURCE_SHA256,,}" ]; then
              echo "::error::vNext 源包哈希不符：期望 $SOURCE_SHA256，实得 $ACTUAL_SOURCE"
              exit 1
            fi
          fi

      - name: 🈶 生成 v7 运行时汉化与执行标记
        run: |
          set -euo pipefail
          ROOT=.build/runtime-i18n
          FINAL="$ROOT/cn_js_update_v7_full_cn_runtime_i18n.zip"

          python3 tools/apply-cn-js-english-i18n.py \
            "$ROOT/input-runtime.zip" \
            "$ROOT/pre-marker-1.zip" \
            --report "$ROOT/translation_QA.json"
          python3 tools/stamp-runtime-i18n-marker.py \
            "$ROOT/pre-marker-1.zip" "$FINAL" \
            --package-id "$PACKAGE_ID" \
            --report "$ROOT/runtime-marker_QA.json"

          # 从原始输入重新走一遍完整的翻译+标记链，必须逐字节一致。
          python3 tools/apply-cn-js-english-i18n.py \
            "$ROOT/input-runtime.zip" \
            "$ROOT/pre-marker-2.zip" \
            --report "$ROOT/repro-translation_QA.json"
          python3 tools/stamp-runtime-i18n-marker.py \
            "$ROOT/pre-marker-2.zip" "$ROOT/repro-final.zip" \
            --package-id "$PACKAGE_ID" \
            --report "$ROOT/repro-marker_QA.json"
          cmp "$FINAL" "$ROOT/repro-final.zip"

          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          root = Path('.build/runtime-i18n')
          final = root / 'cn_js_update_v7_full_cn_runtime_i18n.zip'
          translation = json.loads((root / 'translation_QA.json').read_text('utf-8'))
          marker = json.loads((root / 'runtime-marker_QA.json').read_text('utf-8'))
          with zipfile.ZipFile(final) as zf:
              names = [i.filename for i in zf.infolist() if not i.is_dir()]
              jquery = zf.read('magica/js/libs/jquery-3.7.1.min.js')
          assert len(names) == 401
          assert b'__MAGIACN_RUNTIME_I18N__' in jquery
          assert marker['changedEntries'] == ['magica/js/libs/jquery-3.7.1.min.js']
          report = {
              'package': str(final),
              'packageId': marker['packageId'],
              'sha256': hashlib.sha256(final.read_bytes()).hexdigest(),
              'entries': len(names),
              'translationQA': translation,
              'runtimeMarkerQA': marker,
              'deterministicRebuild': True,
              'runtimeExecutionMarkerPresent': True,
          }
          (root / 'cn_js_update_v7_full_cn_runtime_i18n_QA.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY

          rm -f "$ROOT/pre-marker-1.zip" "$ROOT/pre-marker-2.zip" \
                "$ROOT/repro-final.zip" "$ROOT/repro-translation_QA.json" \
                "$ROOT/repro-marker_QA.json"
          echo '翻译、执行标记与确定性复构建校验通过'

      - name: ✅ 验收 v7 运行时包与 vNext 源
        run: |
          set -euo pipefail
          ROOT=.build/runtime-i18n
          FINAL="$ROOT/cn_js_update_v7_full_cn_runtime_i18n.zip"
          ARGS=(
            --runtime "$ROOT/input-runtime.zip"
            --runtime "$FINAL"
            --report "$ROOT/cn_js_update_package_compatibility_QA.json"
          )
          if [ -f "$ROOT/input-source.zip" ]; then
            ARGS+=(--source "$ROOT/input-source.zip")
          fi
          python3 tools/verify-cn-js-update-package.py "${ARGS[@]}" \
            > "$ROOT/verification-output.json"

          python3 tools/audit-webview-runtime-overlay.py \
            --runtime "$FINAL" \
            --report "$ROOT/webview-runtime-overlay-audit.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.build/runtime-i18n')
          compat = json.loads((root / 'cn_js_update_package_compatibility_QA.json').read_text('utf-8'))
          assert all(item['valid'] and item['classification'] == 'runtime-overlay'
                     for item in compat['runtime_packages'])
          if compat['source_package'] is not None:
              assert compat['source_package']['valid']
              assert compat['source_package']['classification'] == 'deduplicated-source-only'
          assert compat['decision']['html_replacement_mechanism_active'] is True
          audit = json.loads((root / 'webview-runtime-overlay-audit.json').read_text('utf-8'))
          assert audit['originalLoaderEnabled'] is True
          assert audit['effectiveBuildStaticallyReady'] is True
          assert audit['runtimePackageValid'] is True
          assert audit['runtimePackage']['entries'] == 401
          assert audit['runtimePackage']['packagedHtmlReferencedByPackagedJs'] > 0
          PY

      - name: 📤 上传 v7 覆盖包与 QA
        uses: actions/upload-artifact@v4
        with:
          name: cn-js-update-v7-runtime-i18n
          path: |
            .build/runtime-i18n/cn_js_update_v7_full_cn_runtime_i18n.zip
            .build/runtime-i18n/cn_js_update_v7_full_cn_runtime_i18n_QA.json
            .build/runtime-i18n/translation_QA.json
            .build/runtime-i18n/runtime-marker_QA.json
            .build/runtime-i18n/cn_js_update_package_compatibility_QA.json
            .build/runtime-i18n/webview-runtime-overlay-audit.json
            .build/runtime-i18n/verification-output.json
          retention-days: 30
          compression-level: 0

      - name: 📊 构建报告
        if: always()
        run: |
          ROOT=.build/runtime-i18n
          FINAL="$ROOT/cn_js_update_v7_full_cn_runtime_i18n.zip"
          {
            echo '## 前端汉化覆盖包 v7'
            echo
            if [ -f "$FINAL" ]; then
              echo '- 状态：✅ 翻译、执行标记、兼容性与确定性构建通过'
              echo "- Package ID：\`${PACKAGE_ID}\`"
              echo "- SHA-256：\`$(sha256sum "$FINAL" | awk '{print $1}')\`"
              echo '- 条目：401（完整 `magica/js/**` + `magica/template/**` 运行时覆盖）'
              echo '- 执行探针：`window.__MAGIACN_RUNTIME_I18N__`'
              echo '- 发布动作：未执行；仅上传临时 artifact'
            else
              echo '- 状态：❌ 未产出 v7'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
