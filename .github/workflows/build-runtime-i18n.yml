name: 🈶 构建前端汉化覆盖包 v7.1

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: '基础运行时 cn_js_update.zip 的 HTTPS 地址'
        type: string
        required: true
        default: 'https://github.com/HiiragiNemu/magireco-cn-patch/releases/download/latest/cn_js_update.zip'
      runtime_sha256:
        description: '基础包 SHA-256；留空则只记录、不强制匹配'
        type: string
        required: false
        default: ''
      source_url:
        description: '可选：vNext 去重 JSON 源 ZIP 的 HTTPS 地址'
        type: string
        required: false
        default: ''
      source_sha256:
        description: '可选：vNext 源 ZIP SHA-256'
        type: string
        required: false
        default: ''
      package_id:
        description: '写入 window.__MAGIACN_RUNTIME_I18N__ 的包标识'
        type: string
        required: true
        default: 'runtime-i18n-v7.1'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/build-runtime-i18n.yml'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'feature/legacy-client-runtime-i18n'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_URL: ${{ inputs.runtime_url || 'https://github.com/HiiragiNemu/magireco-cn-patch/releases/download/latest/cn_js_update.zip' }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 || '' }}
      SOURCE_URL: ${{ inputs.source_url || '' }}
      SOURCE_SHA256: ${{ inputs.source_sha256 || '' }}
      PACKAGE_ID: ${{ inputs.package_id || 'runtime-i18n-v7.1-pr' }}
      JP_SOURCE_COMMIT: '58ef03a1395f11072c7f5368e0cb06c37e41cbda'

    steps:
      - name: 🛡️ 校验仓库、分支与输入
        run: |
          set -euo pipefail
          ALLOWED='magirecocn-revival-project/magirecocn-legacy-client'
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          [ "${GITHUB_REPOSITORY,,}" = "$ALLOWED" ] || { echo '::error::仓库不符'; exit 1; }
          [ "$BRANCH" = 'feature/legacy-client-runtime-i18n' ] \
            || { echo "::error::只允许工作分支运行，当前 $BRANCH"; exit 1; }
          case "$RUNTIME_URL" in https://*) ;; *) echo '::error::runtime_url 必须为 HTTPS'; exit 1;; esac
          if [ -n "$SOURCE_URL" ]; then case "$SOURCE_URL" in https://*) ;; *) exit 1;; esac; fi
          for value in "$RUNTIME_SHA256" "$SOURCE_SHA256"; do
            if [ -n "$value" ] && ! printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo '::error::SHA-256 必须是 64 位十六进制或留空'; exit 1
            fi
          done
          printf '%s' "$PACKAGE_ID" | grep -Eq '^[A-Za-z0-9._-]{1,64}$' \
            || { echo '::error::package_id 格式错误'; exit 1; }

      - name: 📦 检出工作分支
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 下载运行时包、vNext 与固定日文数据源
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply-cn-js-english-i18n.py \
            tools/naturalize-runtime-game-data.py \
            tools/stamp-runtime-i18n-marker.py \
            tools/verify-cn-js-update-package.py \
            tools/audit-webview-runtime-overlay.py

          ROOT=.build/runtime-i18n
          JP="$ROOT/jp-source"
          mkdir -p "$ROOT" "$JP"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 300 -o "$ROOT/input-runtime.zip" "$RUNTIME_URL"
          ACTUAL_RUNTIME=$(sha256sum "$ROOT/input-runtime.zip" | awk '{print $1}')
          echo "基础运行时包 SHA-256: $ACTUAL_RUNTIME"
          if [ -n "$RUNTIME_SHA256" ] && [ "${ACTUAL_RUNTIME,,}" != "${RUNTIME_SHA256,,}" ]; then
            echo "::error::基础包哈希不符"; exit 1
          fi

          if [ -n "$SOURCE_URL" ]; then
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 -o "$ROOT/input-source.zip" "$SOURCE_URL"
            ACTUAL_SOURCE=$(sha256sum "$ROOT/input-source.zip" | awk '{print $1}')
            if [ -n "$SOURCE_SHA256" ] && [ "${ACTUAL_SOURCE,,}" != "${SOURCE_SHA256,,}" ]; then
              echo "::error::vNext 哈希不符"; exit 1
            fi
          fi

          for file in cardMagiaMap.json doppelCardMagiaMap.json pieceSkillMap.json emotionSkillMap.json; do
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              -o "$JP/$file" \
              "https://raw.githubusercontent.com/Puella-Care/en-data/${JP_SOURCE_COMMIT}/${file}"
            python3 -m json.tool "$JP/$file" >/dev/null
          done

      - name: 🈶 生成 v7.1 翻译、自然中文与执行标记
        run: |
          set -euo pipefail
          ROOT=.build/runtime-i18n
          FINAL="$ROOT/cn_js_update_v7_1_full_cn_natural_runtime.zip"

          build_once() {
            local suffix="$1"
            python3 tools/apply-cn-js-english-i18n.py \
              "$ROOT/input-runtime.zip" "$ROOT/translated-$suffix.zip" \
              --report "$ROOT/translation-$suffix.json"
            python3 tools/naturalize-runtime-game-data.py \
              "$ROOT/translated-$suffix.zip" "$ROOT/natural-$suffix.zip" \
              --jp-source-dir "$ROOT/jp-source" \
              --minimum-source-translations 50 \
              --report "$ROOT/natural-$suffix.json"
            python3 tools/stamp-runtime-i18n-marker.py \
              "$ROOT/natural-$suffix.zip" "$ROOT/final-$suffix.zip" \
              --package-id "$PACKAGE_ID" \
              --report "$ROOT/marker-$suffix.json"
          }
          build_once one
          build_once two
          cmp "$ROOT/final-one.zip" "$ROOT/final-two.zip"
          mv "$ROOT/final-one.zip" "$FINAL"

          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root=Path('.build/runtime-i18n')
          final=root/'cn_js_update_v7_1_full_cn_natural_runtime.zip'
          natural=json.loads((root/'natural-one.json').read_text('utf-8'))
          marker=json.loads((root/'marker-one.json').read_text('utf-8'))
          with zipfile.ZipFile(final) as zf:
              names=[i.filename for i in zf.infolist() if not i.is_dir()]
              jquery=zf.read('magica/js/libs/jquery-3.7.1.min.js')
          assert len(names)==401
          assert b'__MAGIACN_RUNTIME_I18N__' in jquery
          assert natural['sourceDrivenDescriptionReplacements'] >= 50
          assert natural['highConfidenceArtifactsRemaining'] == {}
          assert natural['jqueryDictionaryRebuilt'] is True
          report={
              'schema':1,'package':str(final),'packageId':marker['packageId'],
              'sha256':hashlib.sha256(final.read_bytes()).hexdigest(),
              'entries':len(names),'deterministicRebuild':True,
              'runtimeExecutionMarkerPresent':True,
              'naturalChineseQA':natural,
          }
          (root/'cn_js_update_v7_1_QA.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY
          rm -f "$ROOT"/translated-*.zip "$ROOT"/natural-*.zip "$ROOT/final-two.zip

      - name: ✅ 验收运行时调用链、JSON 与 vNext
        run: |
          set -euo pipefail
          ROOT=.build/runtime-i18n
          FINAL="$ROOT/cn_js_update_v7_1_full_cn_natural_runtime.zip"
          ARGS=(--runtime "$ROOT/input-runtime.zip" --runtime "$FINAL" \
                --report "$ROOT/package-compatibility.json")
          [ ! -f "$ROOT/input-source.zip" ] || ARGS+=(--source "$ROOT/input-source.zip")
          python3 tools/verify-cn-js-update-package.py "${ARGS[@]}" > "$ROOT/verification-output.json"
          python3 tools/audit-webview-runtime-overlay.py --runtime "$FINAL" \
            --report "$ROOT/webview-runtime-overlay-audit.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('.build/runtime-i18n')
          compat=json.loads((r/'package-compatibility.json').read_text('utf-8'))
          assert all(x['valid'] and x['classification']=='runtime-overlay'
                     for x in compat['runtime_packages'])
          assert compat['decision']['html_replacement_mechanism_active'] is True
          audit=json.loads((r/'webview-runtime-overlay-audit.json').read_text('utf-8'))
          assert audit['originalLoaderEnabled'] is True
          assert audit['effectiveBuildStaticallyReady'] is True
          assert audit['runtimePackageValid'] is True
          PY

      - name: 📤 上传 v7.1 覆盖包与 QA
        uses: actions/upload-artifact@v4
        with:
          name: cn-js-update-v7-1-natural-runtime
          path: |
            .build/runtime-i18n/cn_js_update_v7_1_full_cn_natural_runtime.zip
            .build/runtime-i18n/cn_js_update_v7_1_QA.json
            .build/runtime-i18n/translation-one.json
            .build/runtime-i18n/natural-one.json
            .build/runtime-i18n/marker-one.json
            .build/runtime-i18n/package-compatibility.json
            .build/runtime-i18n/webview-runtime-overlay-audit.json
            .build/runtime-i18n/verification-output.json
          retention-days: 30
          compression-level: 0

      - name: 📊 构建报告
        if: always()
        run: |
          FINAL=.build/runtime-i18n/cn_js_update_v7_1_full_cn_natural_runtime.zip
          {
            echo '## 前端汉化覆盖包 v7.1'
            if [ -f "$FINAL" ]; then
              echo '- 状态：✅ 翻译、自然中文、执行标记、兼容性与确定性构建通过'
              echo "- SHA-256：\`$(sha256sum "$FINAL" | awk '{print $1}')\`"
              echo '- 路径：401 个，未发布，仅上传 artifact'
            else
              echo '- 状态：❌ 未产出'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
